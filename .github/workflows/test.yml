name: Test mail connector
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 22.19.0
          - os: windows-latest
            node: 24.6.0
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 22
          - os: macos-latest
            node: 24
          - os: macos-15-intel
            node: 22
          - os: macos-15-intel
            node: 24
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Windows trusted certificates work with TLS validation
        if: runner.os == 'Windows'
        run: node scripts/system-ca-smoke.js
      - name: Saved credentials survive fresh processes
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: node scripts/keyring-smoke.js
      - name: Actual data-directory and credential preflight
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: node src/cli.js doctor --storage
      - run: node src/cli.js doctor
